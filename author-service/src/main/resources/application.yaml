server:
  port: 9002
  servlet:
    context-path: /author-service

spring:
  application:
    name: author-service

  datasource:
    url: jdbc:h2:mem:authordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties.hibernate:
      format_sql: true
      show_sql: true
      use_sql_comment: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      schema-locations: classpath*:db/schema.sql
      data-locations: classpath*:db/data.sql

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: trace

---
spring:
  config:
    activate:
      on-profile: loc

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOSTNAME:${INJE_DISCOVERY_SERVER_SERVICE_HOST:localhost}}:${INJE_DISCOVERY_SERVER_SERVICE_PORT:8761}/discovery/eureka

---
spring:
  config:
    activate:
      on-profile: dev

eureka:
  instance:
    instance-id: author-service-svc.inje-msa-demo-dev.svc.cluster.local:9002
    hostname: author-service-svc.inje-msa-demo-dev.svc.cluster.local
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-server-svc.inje-msa-demo-dev.svc.cluster.local:8761/discovery/eureka

---
spring:
  config:
    activate:
      on-profile: prd