server:
  port: 8000

spring:
  application:
    name: inje-api-gateway
  cloud:
    gateway:
      default-filters:
        - name: GlobalLoggingFilter
          args:
            baseMessage: Spring Cloud Gateway GlobalLoggingFilter
            preLogger: true
            postLogger: true
      routes:
        - id: book-service
          uri: lb://BOOK-SERVICE
          predicates:
            - Path=/book-service/books/**
        - id: author-service
          uri: lb://AUTHOR-SERVICE
          predicates:
            - Path=/author-service/authors/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/review-service/reviews/**

logging:
  level:
    com.inje.apigateway: debug

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: loc

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOSTNAME:${INJE_DISCOVERY_SERVER_SERVICE_HOST:localhost}}:${INJE_DISCOVERY_SERVER_SERVICE_PORT:8761}/discovery/eureka

---
spring:
  config:
    activate:
      on-profile: dev

eureka:
  instance:
    instance-id: gateway-server-svc.inje-msa-demo-dev.svc.cluster.local:8000
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-server-svc.inje-msa-demo-dev.svc.cluster.local:8761/discovery/eureka

---
spring:
  config:
    activate:
      on-profile: prd