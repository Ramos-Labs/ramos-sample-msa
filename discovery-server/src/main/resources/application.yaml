server:
  port: 8761
  servlet:
    context-path: /discovery

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:${INJE_DISCOVERY_SERVER_SERVICE_HOST:localhost}}
  server:
    eviction-interval-timer-in-ms: 10000
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${INJE_DISCOVERY_SERVER_SERVICE_HOST:localhost}:${INJE_DISCOVERY_SERVER_SERVICE_PORT:8761}/eureka/

spring:
  application:
    name: inje-discovery-server

logging:
  level:
    com.inje.injediscoveryserver: debug

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: loc

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prd